<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - PalugadaKuYy</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="kotak">
    <div class="header">
        <h1>PalugadaKuYy</h1>
        <p>Apa Yang Lu Mau Gua Ada</p>
    </div>
    <div class="navi">
        <a href="index.html">Home</a>
        <a href="produk.html">Produk</a>
        <a href="kontak.html">Kontak</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="galeri.html">Galeri</a>
        <a href="bantuan.html">Bantuan</a>
    </div>
    <div class="content">
        <h2>Produk Kami</h2>
        <p>Berbagai produk digital tersedia di PalugadaKuYy.</p>
        
        <!-- Wadah Produk -->
        <div id="daftarProduk" style="margin-top:20px;"></div>
    </div>
    <div class="footer">
        <p>© 2026 PalugadaKuYy | Website Digital Serba Ada</p>
    </div>
</div>

<script>
  const SUPABASE_URL = 'https://mcxerfmuxuuyxggdhir.supabase.co';
  const SUPABASE_ANON_KEY = 'MASUKKAN_ANON_KEY_ANDA_DI_SINI'; 
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function muatProduk() {
    const { data, error } = await supabaseClient
      .from('produk')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Gagal mengambil data produk:', error);
      return;
    }

    const container = document.getElementById('daftarProduk');
    container.innerHTML = '';

    if (data.length === 0) {
      container.innerHTML = '<p>Belum ada produk yang tersedia.</p>';
      return;
    }

    data.forEach(item => {
      const card = document.createElement('div');
      card.style.cssText = 'border: 1px solid #ddd; border-left: 5px solid #D4AF37; padding: 15px; margin: 15px auto; max-width: 500px; border-radius: 8px; text-align: left; background: #fafafa;';
      card.innerHTML = `
        <h3 style="margin-top: 0; color: #111;">${item.nama_produk}</h3>
        <p><strong>Harga:</strong> Rp ${Number(item.harga).toLocaleString('id-ID')}</p>
        <p>${item.deskripsi || ''}</p>
      `;
      container.appendChild(card);
    });
  }

  muatProduk();
</script>

</body>
</html>
